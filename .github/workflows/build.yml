name: Build and self-test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run lightweight core checks
        run: ./run_tests.sh
